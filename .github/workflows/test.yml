name: Test

on:
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install Forge dependencies
        run: |
          cd contracts
          forge install OpenZeppelin/openzeppelin-contracts
          forge install foundry-rs/forge-std

      - name: Build native modules
        run: |
          cd node_modules/.pnpm/better-sqlite3@12.8.0/node_modules/better-sqlite3
          npm run build-release

      - name: Run linter
        run: pnpm lint

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Run tests with coverage
        run: npm run test:cov

      - name: Run Solidity contract tests
        run: cd contracts && forge test

      - name: Start Anvil
        run: anvil &

      - name: Wait for Anvil
        run: |
          timeout 30 bash -c 'until curl -s -X POST -H "Content-Type: application/json" --data '\''{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'\'' http://127.0.0.1:8545 > /dev/null; do sleep 1; done'

      - name: Build application
        run: pnpm build

      - name: Generate self-signed TLS certificates
        run: |
          mkdir -p secrets
          openssl req -x509 -newkey rsa:4096 -keyout secrets/tls.key -out secrets/tls.cert -days 1 -nodes -subj "/CN=localhost"

      - name: Start API server
        run: node dist/src/main.js &
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Wait for API server
        run: |
          timeout 30 bash -c 'until curl -k -s https://localhost:3000/health > /dev/null 2>&1; do sleep 1; done'

      - name: Run ZK tests
        run: pnpm test:zk

      - name: Run ZK integration tests
        run: pnpm test:zk:integration
